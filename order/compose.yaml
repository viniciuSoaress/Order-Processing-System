services:
  db:
    image: postgres:17-alpine
    container_name: db_processing_order
    environment:
      POSTGRES_DB: processing_order
      POSTGRES_USER: processing_order_user
      POSTGRES_PASSWORD: processing_order_ps
    ports:
      - "5656:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - order-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U processing_order_user -d processing_order_ps" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  order-network:
    external: true
    name: order-processing-network